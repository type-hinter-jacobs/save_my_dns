<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Save My DNS - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body class="bg-light">
    <div class="container mt-5">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">Save My DNS - Admin Dashboard</h1>
        <form method="post" action="/logout">
          <button class="btn btn-outline-danger btn-sm">Logout</button>
        </form>
      </div>

      {% if flash %}
        <div class="alert alert-info">
          {{ flash }}
        </div>
      {% endif %}

      <div class="card mb-4">
        <div class="card-body">
          <form method="post" action="/dashboard/domains" class="row g-3">
            <div class="col-auto">
              <input type="text" name="domain" class="form-control" placeholder="Enter domain name">
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary">Add Domain</button>
            </div>
          </form>
        </div>
      </div>

      <table class="table table-bordered table-hover bg-white">
        <thead class="table-light">
          <tr>
            <th>Domain</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for domain in items %}
            <tr>
              <td>{{ domain.domain }}</td>

              <td>
                {% if domain.enabled %}
                  <span class="badge bg-success">Enabled</span>
                {% else %}
                  <span class="badge bg-secondary">Disabled</span>
                {% endif %}
              </td>

              <td>
                <form method="post" action="/dashboard/domains/{{ domain.domain }}/toggle">
                  {% if domain.enabled %}
                    <input type="hidden" name="enabled" value="false">
                    <button class="btn btn-warning btn-sm">Disable</button>
                  {% else %}
                    <input type="hidden" name="enabled" value="true">
                    <button class="btn btn-success btn-sm">Enable</button>
                  {% endif %}
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>

    </div>
  </body>
</html>
